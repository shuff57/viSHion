<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export transcripts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
body{margin:0;background:#EEF1F5}
a{color:var(--ink)}
a:hover{color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ghost{background:transparent;border:0;border-radius:8px;color:inherit;font:inherit;cursor:pointer}
.ghost:hover{background:var(--hover)}
.act{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 14px;box-sizing:border-box;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.act:hover{background:var(--sunken)}
</style>
</helmet>

<div style="{{tk}}">
<div style="position: relative; min-height: 900px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.4">

  <div aria-hidden="true" style="position: absolute; inset: 0">
    <div style="height: 64px; background: var(--surface); border-bottom: 1px solid var(--line)"></div>
    <div style="max-width: 1120px; margin: 0 auto; padding: 40px 24px">
      <div style="width: 420px; max-width: 100%; height: 40px; border-radius: 6px; background: var(--hover)"></div>
      <div style="height: 12px; margin-top: 40px; border-radius: 6px; background: var(--hover)"></div>
      <div style="height: 340px; margin-top: 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface)"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="export-title" style="position: relative; width: 600px; max-width: calc(100% - 32px); margin: 48px auto; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 12px; background: var(--surface); box-shadow: 0 24px 64px -8px rgba(5,7,11,.5)">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 12px 28px; border-bottom: 1px solid var(--line)">
      <h1 id="export-title" style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.2">Export transcripts</h1>
      <a href="Batch.dc.html" class="ghost" aria-label="Close export" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px; padding: 24px 28px">

      <fieldset style="min-width: 0; margin: 0; padding: 0; border: 0">
        <legend style="margin-bottom: 8px; padding: 0; font-weight: 600">Who to include</legend>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="scope-all" style="{{rowAll}}">
            <input type="radio" name="scope" id="scope-all" checked="{{isAll}}" onChange="{{pickAll}}" style="flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--ink)">
            <span>Everyone (12 students, 15 pages)</span>
          </label>
          <label for="scope-ready" style="{{rowReady}}">
            <input type="radio" name="scope" id="scope-ready" checked="{{isReady}}" onChange="{{pickReady}}" style="flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--ink)">
            <span>Only students who are ready to read (5)</span>
          </label>
        </div>
      </fieldset>

      <div style="display: flex; flex-wrap: wrap; gap: 14px">
        <div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px">
          <label for="ex-mode" style="font-weight: 600">Text</label>
          <select id="ex-mode" style="height: 44px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit">
            <option>Corrected</option>
            <option>Original</option>
            <option>Both</option>
          </select>
        </div>
        <div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px">
          <label for="ex-sep" style="font-weight: 600">Between pages</label>
          <select id="ex-sep" style="height: 44px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit">
            <option>A “Page N” line</option>
            <option>A page break</option>
            <option>Nothing</option>
          </select>
        </div>
        <div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px">
          <label for="ex-fmt" style="font-weight: 600">Combined file</label>
          <select id="ex-fmt" style="height: 44px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit">
            <option>Word (.docx)</option>
            <option>Markdown (.md)</option>
            <option>Plain text (.txt)</option>
          </select>
        </div>
      </div>

      <p role="status" style="{{summaryStyle}}">{{summary}}</p>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-weight: 600">Or export just one kind of file</span>
        <button type="button" class="act">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5zM14 3v5h5M9 13h6M9 17h6"/></svg>
          <span><span style="display: block; font-weight: 600">Combined file</span><span style="display: block; font-size: 13px; color: var(--muted)">Every student in one document</span></span>
        </button>
        <button type="button" class="act">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 012-2h10"/></svg>
          <span><span style="display: block; font-weight: 600">One file per page (.zip)</span><span style="display: block; font-size: 13px; color: var(--muted)">A separate file for each page, named by student</span></span>
        </button>
        <button type="button" class="act">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
          <span><span style="display: block; font-weight: 600">CSV index</span><span style="display: block; font-size: 13px; color: var(--muted)">A spreadsheet of every page and its status</span></span>
        </button>
        <button type="button" class="act">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 4C7 4 7 6 7 8s0 3-2 4c2 1 2 2 2 4s0 4 2 4M15 4c2 0 2 2 2 4s0 3 2 4c-2 1-2 2-2 4s0 4-2 4"/></svg>
          <span><span style="display: block; font-weight: 600">JSON</span><span style="display: block; font-size: 13px; color: var(--muted)">All the data, for other tools</span></span>
        </button>
        <button type="button" class="act">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>
          <span><span style="display: block; font-weight: 600">Copy all text</span><span style="display: block; font-size: 13px; color: var(--muted)">Puts the text on your clipboard</span></span>
        </button>
      </div>

      <p style="margin: 0; font-size: 13px; color: var(--muted)">When a folder is connected, each export is also saved in the assignment’s exports folder.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 14px 28px; border-top: 1px solid var(--line)">
      <a href="Batch.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; box-sizing: border-box; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 600; text-decoration: none">Cancel</a>
      <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--ink); color: var(--on-ink); font: inherit; font-weight: 600; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
        Download all (.zip)
      </button>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scope: 'all' };
  }

  tk() {
    const L = { bg: '#EEF1F5', surface: '#FFFFFF', sunken: '#F3F5F8', ink: '#141B2D', 'on-ink': '#FFFFFF', muted: '#5A6477', line: '#D3D9E2', line2: '#BCC5D2', hover: '#E4E9F0', accent: '#26358F', 'warn-bg': '#FFF6CF', 'warn-line': '#E6C84F', 'ok-bg': '#DDF0E5', ok: '#176B45', scrim: 'rgba(20,27,45,.5)' };
    const D = { bg: '#0F131C', surface: '#171C28', sunken: '#1D2331', ink: '#E8ECF3', 'on-ink': '#0F131C', muted: '#9AA5B8', line: '#2B3345', line2: '#3E4A63', hover: '#232B3B', accent: '#9DB0FF', 'warn-bg': '#3A3110', 'warn-line': '#7A6516', 'ok-bg': '#14382A', ok: '#5FD39A', scrim: 'rgba(5,7,11,.62)' };
    const dark = this.props.dark === true || this.props.dark === 'true';
    const T = dark ? D : L;
    return Object.keys(T).map((k) => '--' + k + ':' + T[k]).join(';') + ';display:contents;';
  }

  renderVals() {
    const all = this.state.scope === 'all';
    const rowBase = 'display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 12px;box-sizing:border-box;border-radius:8px;cursor:pointer;';
    const on = rowBase + 'border:1px solid var(--ink);';
    const off = rowBase + 'border:1px solid var(--line2);';
    const sBase = 'margin:0;padding:10px 14px;border-radius:8px;';
    return {
      tk: this.tk(),
      isAll: all,
      isReady: !all,
      rowAll: all ? on : off,
      rowReady: all ? off : on,
      pickAll: () => this.setState({ scope: 'all' }),
      pickReady: () => this.setState({ scope: 'ready' }),
      summary: all
        ? '4 of 15 pages have no transcript yet. They will be empty in the export.'
        : 'All 5 pages are transcribed.',
      summaryStyle: sBase + (all ? 'border:1px solid var(--warn-line);background:var(--warn-bg);' : 'border:1px solid transparent;background:var(--ok-bg);color:var(--ok);font-weight:600;')
    };
  }
}
</script>
</body>
</html>
