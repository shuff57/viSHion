<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assignment inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
body{margin:0;background:#EEF1F5}
a{color:var(--ink)}
a:hover{color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.row:hover{background:var(--sunken)}
.tab:hover{background:var(--hover)}
.ghost{background:transparent;border:0;border-radius:8px;color:inherit;font:inherit;cursor:pointer}
.ghost:hover{background:var(--hover)}
</style>
</helmet>

<div style="{{tk}}">
<div style="min-height: 900px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.4">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; min-height: 64px; padding: 8px 24px; box-sizing: border-box; background: var(--surface); border-bottom: 1px solid var(--line)">
    <a href="Projects.dc.html" style="display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none">Handwriting Transcriber</a>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
      <span style="display: flex; align-items: center; gap: 6px; color: var(--muted)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--ok)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Saved to your folder
      </span>
      <a href="Settings.dc.html" aria-label="Settings" title="Settings" class="ghost" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      </a>
    </div>
  </header>

  <div style="width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 40px 24px 56px">

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div>
        <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 36px; font-weight: 600; line-height: 1.15">Unit 5 written response</h1>
        <p style="margin: 8px 0 0; color: var(--muted)">Intro to Statistics, 12 students</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <a href="AssignmentSettings.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 8px; color: var(--ink); font-weight: 600; text-decoration: none">Assignment settings</a>
        <a href="Export.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; box-sizing: border-box; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 600; text-decoration: none">Export transcripts</a>
        <a href="Add.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; box-sizing: border-box; border-radius: 8px; background: var(--ink); color: var(--on-ink); font-weight: 600; text-decoration: none">Add pages</a>
      </div>
    </div>

    <div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 28px; padding: 14px 20px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; background: var(--surface)">
      <div style="flex: 1 1 280px; min-width: 0">
        <div style="font-weight: 600">Reading Noor A.’s page, 11 of 12</div>
        <div style="margin-top: 2px; font-size: 13px; color: var(--muted)">3 pages left, about 40 seconds</div>
        <div style="height: 8px; margin-top: 10px; border-radius: 4px; background: var(--track); overflow: hidden"><div style="width: 83%; height: 100%; border-radius: 4px; background: var(--ink)"></div></div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer">Retry 1 failed</button>
        <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer">Stop</button>
      </div>
    </div>

    <div style="display: flex; gap: 3px; height: 12px; margin-top: 24px" role="img" aria-label="{{barLabel}}">
      <div style="{{barReady}}"></div>
      <div style="{{barCheck}}"></div>
      <div style="{{barFail}}"></div>
      <div style="{{barProc}}"></div>
    </div>

    <div role="group" aria-label="Filter students" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button class="tab" type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">
          <span style="{{t.dot}}"></span>
          <span>{{t.label}}</span>
          <span style="font-variant-numeric: tabular-nums; opacity: .75">{{t.n}}</span>
        </button>
      </sc-for>
    </div>

    <div style="margin-top: 20px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface)">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div class="row" style="display: flex; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--soft)">
          <a href="Main.dc.html" style="flex: 1 1 360px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; min-height: 44px; padding: 14px 20px; box-sizing: border-box; color: var(--ink); text-decoration: none">
            <div style="{{r.thumb}}" aria-hidden="true">
              <div style="position: absolute; top: 0; bottom: 0; left: 8px; width: 1px; background: #E7A3A3"></div>
              <div style="position: absolute; top: 0; bottom: 0; left: 11px; right: 5px; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(38,53,143,.55) 3px, rgba(38,53,143,.55) 4px, transparent 4px, transparent 7px)"></div>
            </div>
            <div style="flex: 1 1 160px; min-width: 0">
              <div style="font-size: 16px; font-weight: 600">{{r.name}}</div>
              <div style="margin-top: 2px; font-size: 13px; color: var(--muted)">{{r.meta}}</div>
            </div>
            <span style="{{r.chip}}">{{r.chipText}}</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
          </a>
          <sc-if value="{{r.failed}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-label="{{r.retryLabel}}" style="flex: none; height: 44px; margin: 0 20px 0 0; padding: 0 16px; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer">Retry</button>
          </sc-if>
        </div>
      </sc-for>
    </div>

  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }

  tk() {
    const L = { bg: '#EEF1F5', surface: '#FFFFFF', sunken: '#F3F5F8', ink: '#141B2D', 'on-ink': '#FFFFFF', muted: '#5A6477', faint: '#8792A6', line: '#D3D9E2', line2: '#BCC5D2', soft: '#E3E8EF', hover: '#E4E9F0', track: '#E1E6EE', warn: '#FFE27A', 'bad-bg': '#FBDAD5', bad: '#A5221B', 'ok-bg': '#DDF0E5', ok: '#176B45', accent: '#26358F', paper: '#FCFCF8' };
    const D = { bg: '#0F131C', surface: '#171C28', sunken: '#1D2331', ink: '#E8ECF3', 'on-ink': '#0F131C', muted: '#9AA5B8', faint: '#6F7A90', line: '#2B3345', line2: '#3E4A63', soft: '#222A3A', hover: '#232B3B', track: '#2A3347', warn: '#6B5712', 'bad-bg': '#4A1F1B', bad: '#FF9C92', 'ok-bg': '#14382A', ok: '#5FD39A', accent: '#9DB0FF', paper: '#D8D7CB' };
    const dark = this.props.dark === true || this.props.dark === 'true';
    const T = dark ? D : L;
    return Object.keys(T).map((k) => '--' + k + ':' + T[k]).join(';') + ';display:contents;';
  }

  renderVals() {
    const rows = [
      { name: 'Aaliyah M.', pages: 1, words: 64, s: 'ready', n: 0 },
      { name: 'Caleb P.', pages: 1, words: 58, s: 'ready', n: 0 },
      { name: 'Devon T.', pages: 2, words: 112, s: 'check', n: 2 },
      { name: 'Eli W.', pages: 1, words: 49, s: 'ready', n: 0 },
      { name: 'Hannah L.', pages: 1, words: 77, s: 'check', n: 1 },
      { name: 'Jonas K.', pages: 1, words: 68, s: 'ready', n: 0 },
      { name: 'Maya R.', pages: 2, words: 167, s: 'check', n: 3 },
      { name: 'Noor A.', pages: 1, words: 0, s: 'processing', n: 0 },
      { name: 'Priya S.', pages: 1, words: 83, s: 'ready', n: 0 },
      { name: 'Sofia V.', pages: 1, words: 66, s: 'check', n: 4 },
      { name: 'Tomás G.', pages: 1, words: 0, s: 'failed', n: 0 },
      { name: 'Zoe B.', pages: 2, words: 0, s: 'queued', n: 0 }
    ];
    const total = rows.length;
    const count = (s) => rows.filter((r) => r.s === s).length;
    const nReady = count('ready');
    const nCheck = count('check');
    const nFail = count('failed');
    const nProc = count('processing') + count('queued');
    const f = this.state.filter;
    const match = (r) => f === 'all' || (f === 'processing' ? (r.s === 'processing' || r.s === 'queued') : r.s === f);

    const seg = (n, bg, edge) => 'height:12px;border-radius:6px;box-sizing:border-box;background:' + bg + ';box-shadow:inset 0 0 0 1px ' + edge + ';width:' + (n / total * 100) + '%;';

    const tabBase = 'display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;';
    const tabOn = 'border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);';
    const tabOff = 'border:1px solid var(--line2);background:transparent;color:var(--ink);';
    const dot = (bg, edge) => 'width:10px;height:10px;border-radius:50%;box-sizing:border-box;background:' + bg + ';box-shadow:inset 0 0 0 1px ' + edge + ';';
    const mkTab = (key, label, n, bg, edge) => ({
      label: label,
      n: n,
      on: f === key,
      style: tabBase + (f === key ? tabOn : tabOff),
      dot: key === 'all' ? 'display:none;' : dot(bg, edge),
      pick: () => this.setState({ filter: key })
    });

    const chipBase = 'flex:none;padding:6px 14px;border-radius:999px;font-weight:600;white-space:nowrap;';
    const chips = {
      ready: chipBase + 'background:var(--ok-bg);color:var(--ok);',
      check: chipBase + 'background:var(--warn);color:var(--ink);',
      processing: chipBase + 'background:var(--hover);color:var(--ink);',
      queued: chipBase + 'background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2);',
      failed: chipBase + 'background:var(--bad-bg);color:var(--bad);'
    };
    const thumbBase = 'position:relative;flex:none;width:40px;height:52px;border-radius:2px;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 6px, #C3D4EA 6px, #C3D4EA 7px);box-shadow:0 1px 2px rgba(20,27,45,.3);';

    const shown = rows.filter(match).map((r) => {
      const pages = r.pages + (r.pages === 1 ? ' page' : ' pages');
      const waiting = r.s === 'processing' || r.s === 'queued' || r.s === 'failed';
      let chipText;
      if (r.s === 'ready') chipText = 'Ready to read';
      else if (r.s === 'check') chipText = r.n + (r.n === 1 ? ' word to check' : ' words to check');
      else if (r.s === 'processing') chipText = 'Transcribing';
      else if (r.s === 'queued') chipText = 'Waiting';
      else chipText = 'Couldn’t transcribe';
      return {
        name: r.name,
        meta: waiting ? pages : pages + ', ' + r.words + ' words',
        chip: chips[r.s],
        chipText: chipText,
        failed: r.s === 'failed',
        retryLabel: 'Retry ' + r.name,
        thumb: thumbBase + (r.s === 'processing' || r.s === 'queued' ? 'opacity:.55;' : '')
      };
    });

    return {
      tk: this.tk(),
      barReady: seg(nReady, '#2F8F62', '#176B45'),
      barCheck: seg(nCheck, '#FFE27A', '#D9A400'),
      barFail: seg(nFail, '#E26D5C', '#A5221B'),
      barProc: seg(nProc, 'var(--track)', 'var(--faint)'),
      barLabel: nReady + ' ready to read, ' + nCheck + ' need a check, ' + nFail + ' failed, ' + nProc + ' not done yet',
      tabs: [
        mkTab('all', 'All', total, '', ''),
        mkTab('ready', 'Ready to read', nReady, '#2F8F62', '#176B45'),
        mkTab('check', 'Needs a check', nCheck, '#FFE27A', '#D9A400'),
        mkTab('processing', 'Transcribing', nProc, 'var(--track)', 'var(--faint)'),
        mkTab('failed', 'Failed', nFail, '#E26D5C', '#A5221B')
      ],
      rows: shown
    };
  }
}
</script>
</body>
</html>
