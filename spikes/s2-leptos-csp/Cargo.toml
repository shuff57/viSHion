[package]
name = "s2-leptos-csp"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
web-sys = { version = "0.3", features = ["Window", "Storage", "Performance"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
