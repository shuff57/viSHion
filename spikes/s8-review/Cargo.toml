[package]
name = "vishion-s8"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.28"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
log = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "Event", "EventTarget", "FocusEvent", "HtmlCollection"] }

[[bin]]
name = "s8"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
