[package]
name = "vishion-s7"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.28"
latex-rust = { version = "2.1.1", features = ["egui"] }
pulldown-cmark = { version = "0.12", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
log = "0.4"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3" }

[profile.release]
opt-level = "s"
lto = true

[[bin]]
name = "s7"
path = "src/main.rs"
