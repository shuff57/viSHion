[package]
name = "s6-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "s6_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-persisted-scope = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# keep this crate out of any parent workspace
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "s"
strip = true
