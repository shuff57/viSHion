[package]
name = "vishion-store-oracle"
description = "wasm test harness: drives the web store backends and the project layer from Chrome (tools/store-oracle). Empty on native."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vishion-core.workspace = true
vishion-store.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "IdbFactory", "IdbOpenDbRequest", "IdbDatabase", "IdbTransaction", "IdbObjectStore", "IdbRequest", "Event"] }
