[package]
name = "vishion-store"
description = "Storage trait plus impls (native fs now; idb and fsa for web in later phases)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vishion-core.workspace = true
serde_json.workspace = true

# Web backends (IndexedDB `ocr_fs`, File System Access). FSA types are handwritten externs in `js.rs`
# (no `--cfg=web_sys_unstable_apis` needed for storage).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Storage", "IdbFactory", "IdbOpenDbRequest", "IdbDatabase", "IdbTransaction", "IdbTransactionMode",
  "IdbObjectStore", "DomStringList", "IdbRequest", "IdbVersionChangeEvent", "DomException", "Blob", "BlobPropertyBag", "Event",
] }
