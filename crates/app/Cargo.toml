[package]
name = "vishion-app"
description = "Thin entry points: native `vishion` binary and the wasm `start()` for the web build."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vishion"
path = "src/main.rs"

[dependencies]
vishion-ui.workspace = true
vishion-core.workspace = true
vishion-store.workspace = true
vishion-net.workspace = true
eframe.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
log = "0.4"
