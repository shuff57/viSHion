<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viSHion</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; }
  canvas { width: 100%; height: 100%; display: block; }
  /* hidden-DOM control layer (a11y twin): visually hidden until a twin has keyboard focus */
  .sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
  .sr:focus-within { opacity: 1; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="controls" class="sr" role="region" aria-label="Controls"></div>
<noscript>viSHion needs JavaScript and WebAssembly.</noscript>
<script type="module">
import init, { start } from './vishion_app.js';
try {
  await init();
  await start('c');
  window.__ready = true;
} catch (e) {
  window.__error = String(e);
  console.error(e);
}
</script>
</body>
</html>
