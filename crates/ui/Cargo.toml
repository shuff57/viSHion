[package]
name = "vishion-ui"
description = "egui app: screens, theme, ctl() control layer and the web a11y twin."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vishion-core.workspace = true
eframe.workspace = true
egui.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "Event", "EventTarget", "HtmlCollection"] }
