[package]
name = "vishion-ui"
description = "egui app: screens, theme, ctl() control layer and the web a11y twin."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vishion-core.workspace = true
eframe.workspace = true
egui.workspace = true
serde_json.workspace = true
# Typeset math (plan rule 6: pinned to egui 0.28). Isolated behind `ui::math` so it can be swapped.
latex-rust = { version = "2.1.1", features = ["egui"] }
# Page images are stored as JPEG; decode in pure Rust so native and wasm behave the same.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Colour emoji: COLR layers from the bundled face, rasterised with the same crate egui's fonts use.
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }
ab_glyph_rasterizer = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }
# The native accessibility tree (`ui::native`): the version egui 0.28 is built against.
accesskit = "0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Node", "Event", "EventTarget", "HtmlCollection", "KeyboardEvent", "NodeList", "CssStyleDeclaration", "MediaQueryList", "ResizeObserver", "ResizeObserverEntry", "WheelEvent", "WheelEventInit", "MouseEvent", "TouchEvent", "TouchList", "Touch", "Selection", "HtmlHeadElement", "DomRect", "HtmlScriptElement", "DomTokenList", "UiEvent", "ClipboardEvent", "DataTransfer", "Range", "DocumentFragment", "Text", "Storage"] }

[dev-dependencies]
# What a platform adapter does with the tree update: the tests feed it the same updates.
accesskit_consumer = "0.16"

[features]
default = []
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]
