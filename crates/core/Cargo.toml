[package]
name = "vishion-core"
description = "Pure model/logic. No UI, no I/O, no egui/web-sys/tokio. Compiles native and wasm32."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Inline markdown for the egui renderer pieces; pure Rust, no HTML output needed.
pulldown-cmark = { version = "0.13", default-features = false }
# NFKD for `OCR.slug` (export file names).
unicode-normalization = "0.1"
icu_collator = "2.3.1"
# Reading project zips (stored or deflated entries), as fflate does in js/fs-projects.js.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
