<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viSHion</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
  /* Apply the saved theme before first paint so there is no flash. */
  try {
    var saved = JSON.parse(localStorage.getItem('ocr_settings_v1') || '{}');
    if (saved.theme) document.documentElement.dataset.theme = saved.theme;
  } catch (e) {}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/motion.css">
</head>
<body>
<div id="app" class="app" data-view="home">
  <header id="topbar" class="topbar"></header>
  <div id="banner" class="banner-slot" role="region" aria-label="Alerts"></div>

  <main id="main" class="main">
    <section id="home" class="view" aria-label="Assignments"></section>
    <section id="inbox" class="view" aria-label="Assignment inbox"></section>
    <section id="add" class="view" aria-label="Add pages"></section>
    <section id="project" class="view review" data-layout="split" aria-label="Review a transcript">
      <section id="doc-pane" class="pane scan" aria-label="Page image"></section>
      <section id="tx-pane" class="pane text" aria-label="Transcript"></section>
    </section>
  </main>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<input id="file-input" type="file" accept="image/png,image/jpeg,image/webp,.heic,.heif,.pdf" multiple hidden>

<noscript><p style="padding:24px">viSHion needs JavaScript.</p></noscript>

<!-- Pinned CDN assets. Each has a fallback in the app if it fails to load. -->
<script defer src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

<!-- Classic scripts on one shared namespace (window.OCR). No ES modules, so file:// works. -->
<script defer src="js/ns.js"></script>
<script defer src="js/state.js"></script>
<script defer src="js/fs.js"></script>
<script defer src="js/fs-projects.js"></script>
<script defer src="js/fs-legacy.js"></script>
<script defer src="js/image.js"></script>
<script defer src="js/deskew.js"></script>
<script defer src="js/ocr.js"></script>
<script defer src="js/render.js"></script>
<script defer src="js/judge.js"></script>
<script defer src="js/queue.js"></script>
<script defer src="js/export.js"></script>
<script defer src="js/models.js"></script>
<script defer src="js/words.js"></script>
<script defer src="js/guess.js"></script>
<script defer src="js/groups.js"></script>
<script defer src="js/student.js"></script>
<script defer src="js/ui/icons.js"></script>
<script defer src="js/ui/modal.js"></script>
<script defer src="js/ui/banner.js"></script>
<script defer src="js/ui/header.js"></script>
<script defer src="js/ui/home.js"></script>
<script defer src="js/ui/inbox.js"></script>
<script defer src="js/ui/upload.js"></script>
<script defer src="js/ui/add.js"></script>
<script defer src="js/ui/review.js"></script>
<script defer src="js/ui/assignment.js"></script>
<script defer src="js/ui/settings.js"></script>
<script defer src="js/ui/export-panel.js"></script>
<script defer src="js/main.js"></script>
</body>
</html>
